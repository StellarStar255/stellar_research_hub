<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>论文研究台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<!-- 复制公式时得到 LaTeX 源码（$d_k$），而不是拆成几行的碎字符 -->
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/copy-tex.min.js"></script>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --side: #efefec; --ink: #1d1d1f; --muted: #76767c; --line: #e3e3de;
  --accent: #3b5bdb; --accent-soft: #e8edff; --ok: #1f9d55; --err: #d6336c; --user: #3b5bdb; --user-ink: #fff;
  --code: #f3f3f0;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161617; --panel: #1f1f21; --side: #1b1b1d; --ink: #ececee; --muted: #9a9aa2; --line: #2e2e31;
          --accent: #748ffc; --accent-soft: #222a45; --user: #4c6ef5; --code: #26262a; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.sec { padding: 10px 16px 4px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .5px; }
.topic-form { margin: 0 12px 6px; }
.topic-form textarea { width: 100%; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px;
                       padding: 6px 9px; font: inherit; font-size: 13px; outline: none; resize: none; }
.topic-form textarea:focus { border-color: var(--accent); }
.topics { max-height: 32vh; overflow-y: auto; padding: 0 8px; flex-shrink: 0; }
.paper.topic .s { display: flex; gap: 6px; align-items: center; }
.strip { display: flex; gap: 6px; padding: 6px 16px; border-bottom: 1px solid var(--line); overflow-x: auto; flex-shrink: 0; }
.strip button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 2px 10px;
                font-size: 12.5px; white-space: nowrap; max-width: 240px; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
.strip button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.pdfbar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
.pdfbar span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.pdfbar button.maxbtn { border-radius: 8px; padding: 1px 9px; font-size: 13px; }
.pdfbar button { border: 1px solid var(--accent); color: var(--accent); background: none; border-radius: 8px; padding: 1px 10px; font-size: 12.5px; }
/* 最大化：论文或对话占满窗口 */
body.max-pdf aside, body.max-pdf main, body.max-pdf #divider,
body.max-chat aside, body.max-chat #pdfPane, body.max-chat #divider { display: none !important; }
body.max-pdf #pdfPane { flex: 1 1 auto !important; display: flex !important; }
body.max-chat main { flex: 1 1 auto; }
body.max-chat .thread, body.max-chat .box, body.max-chat .quick { max-width: 980px; }
.maxbtn { border: 1px solid var(--line) !important; background: var(--panel) !important; color: var(--ink) !important; }
body.max-pdf #maxPdf, body.max-chat #maxChat { border-color: var(--accent) !important; color: var(--accent) !important; }
.md a.paperlink { border-bottom: 1px dashed var(--accent); }
.step.link { cursor: pointer; } .step.link:hover .d { color: var(--accent); }
body { margin: 0; font: 15px/1.7 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
       background: var(--bg); color: var(--ink); display: flex; height: 100vh; overflow: hidden; }
button { font: inherit; cursor: pointer; }

/* ---------- 左：论文库 ---------- */
aside { width: 240px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--line);
        display: flex; flex-direction: column; }
aside.collapsed { display: none; }
.brand { padding: 16px 16px 10px; font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.brand b { background: var(--accent); color: #fff; border-radius: 6px; padding: 0 7px; font-size: 12px; line-height: 22px; }
.add { margin: 0 12px 8px; display: flex; gap: 6px; }
.add input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
             border-radius: 8px; padding: 6px 9px; font: inherit; font-size: 13px; outline: none; }
.add input:focus { border-color: var(--accent); }
.add button, .upload { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px;
                       padding: 4px 9px; font-size: 13px; }
.upload { margin: 0 12px 10px; display: block; text-align: center; }
.add button:hover, .upload:hover { border-color: var(--accent); color: var(--accent); }
.papers { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
.paper { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; line-height: 1.45; position: relative; }
.paper:hover { background: var(--panel); }
.paper.active { background: var(--accent-soft); }
.paper .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.paper .acts { position: absolute; right: 4px; top: 4px; visibility: hidden; display: flex; gap: 1px;
               background: var(--panel); border-radius: 6px; }
.paper:hover .acts { visibility: visible; }
.paper .acts button { border: 0; background: none; color: var(--muted); padding: 0 4px; font-size: 13px; }
.paper .acts button:hover { color: var(--accent); }
.arch-toggle { margin: 4px 16px 6px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
.arch-toggle:hover { color: var(--accent); }
.paper.archived { opacity: .7; }
.side-hint { padding: 10px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }

/* ---------- 中：PDF ---------- */
#pdfPane { flex: 1 1 45%; min-width: 280px; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
#pdfPane.hidden { display: none; }
#pdf { flex: 1; border: 0; width: 100%; background: #525659; }
.pdf-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); padding: 30px; text-align: center; }
#divider { width: 5px; cursor: col-resize; background: transparent; flex-shrink: 0; margin-left: -3px; z-index: 2; }
#divider:hover, #divider.drag { background: var(--accent-soft); }

/* ---------- 右：对话 ---------- */
main { flex: 1 1 55%; display: flex; flex-direction: column; min-width: 360px; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.topbar .title { cursor: text; flex: 1; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar select, .topbar button { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
                                  border-radius: 8px; padding: 3px 8px; font-size: 13px; max-width: 220px; }
.topbar button:hover { border-color: var(--accent); color: var(--accent); }
#scroll { flex: 1; overflow-y: auto; }
.thread { max-width: 820px; margin: 0 auto; padding: 22px 22px 40px; }
.hello { margin-top: 6vh; }
.hello h1 { font-size: 21px; margin: 0 0 4px; line-height: 1.4; }
.hello .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
.hello .abs { color: var(--muted); font-size: 13.5px; border-left: 3px solid var(--line); padding-left: 12px; margin-bottom: 22px;
              max-height: 9.5em; overflow: hidden; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px;
                padding: 5px 13px; font-size: 13.5px; }
.chips button:hover { border-color: var(--accent); color: var(--accent); }
.styles { margin: 18px 0 8px; font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.styles span { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.styles span.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.msg { margin: 18px 0; display: flex; gap: 12px; }
.msg.user { justify-content: flex-end; }
.msg.user .bubble { background: var(--user); color: var(--user-ink); border-radius: 18px 18px 4px 18px;
                    padding: 8px 15px; max-width: 82%; white-space: pre-wrap; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700;
          font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
.body { flex: 1; min-width: 0; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3, .md h4 { font-size: 16px; margin: 18px 0 6px; }
.md a { color: var(--accent); text-decoration: none; } .md a:hover { text-decoration: underline; }
.md a.pg { background: var(--accent-soft); border-radius: 5px; padding: 0 5px; font-size: 13px; white-space: nowrap; }
.md table { border-collapse: collapse; font-size: 13.5px; margin: 10px 0; display: block; overflow-x: auto; }
.md td, .md th { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
.md blockquote { margin: 8px 0; padding: 2px 12px; border-left: 3px solid var(--line); color: var(--muted); }
.md code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
.md pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; line-height: 1.5; }
.md pre code { padding: 0; background: none; }
.md ul, .md ol { padding-left: 22px; }
.md img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
.md .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.step { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin: 6px 0; }
.step .d { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.step.err { color: var(--err); }
details.code { margin: 6px 0; font-size: 13px; }
details.code summary { cursor: pointer; color: var(--muted); }
details.code pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 6px 0; font-size: 12.5px; line-height: 1.5; }
.runbtn { display: inline-flex; align-items: center; gap: 6px; background: var(--ok); color: #fff; border: 0;
          border-radius: 9px; padding: 6px 14px; font-weight: 600; font-size: 14px; margin: 4px 0; }
.runbtn:disabled { opacity: .45; cursor: default; }
.runbtn small { font-weight: 400; opacity: .85; }
.run { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 10px 14px; margin: 14px 0 14px 40px; font-size: 13px; }
.run .h { display: flex; align-items: center; gap: 8px; }
.run .h b { font-family: ui-monospace, Menlo, monospace; font-weight: 600; }
.run pre { background: var(--code); padding: 8px 10px; border-radius: 8px; max-height: 260px; overflow: auto; margin: 8px 0 0;
           font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; }
.run img { max-width: 100%; border-radius: 8px; margin-top: 8px; border: 1px solid var(--line); background: #fff; }
.run.err .h { color: var(--err); }
.spin { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
        animation: spin .8s linear infinite; flex-shrink: 0; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.thinking { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.caret > :last-child::after { content: "▍"; color: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.error { color: var(--err); font-size: 13px; white-space: pre-wrap; margin-top: 6px; }
.meta-line { font-size: 12px; color: var(--muted); margin-top: 8px; }

.composer { padding: 8px 20px 16px; }
.quick { max-width: 820px; margin: 0 auto 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 999px;
                padding: 2px 11px; font-size: 12.5px; }
.quick button:hover { color: var(--accent); border-color: var(--accent); }
.box { max-width: 820px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
       display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 16px; box-shadow: 0 2px 12px rgba(0,0,0,.04); }
.box:focus-within { border-color: var(--accent); }
.box textarea { flex: 1; border: 0; background: none; color: var(--ink); font: inherit; resize: none; outline: none;
                max-height: 200px; padding: 6px 0; }
.send { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 7px 16px; font-weight: 600; }
.send:disabled { opacity: .4; cursor: default; }
.send.stop { background: var(--ink); color: var(--bg); }

/* 笔记抽屉 */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 94vw); background: var(--bg);
          border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(0,0,0,.15); transform: translateX(105%);
          transition: transform .2s; z-index: 8; display: flex; flex-direction: column; }
.drawer.show { transform: none; }
.drawer header { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.drawer header h3 { margin: 0; font-size: 16px; flex: 1; }
.drawer header a.exp { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px;
                       padding: 2px 10px; font-size: 13px; text-decoration: none; }
.drawer header a.exp:hover { border-color: var(--accent); color: var(--accent); }
.drawer header button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 2px 10px; font-size: 13px; }
.drawer textarea { flex: 1; border: 0; padding: 16px 18px; font: 14px/1.7 ui-monospace, Menlo, monospace; background: var(--panel);
                   color: var(--ink); resize: none; outline: none; }
.drawer .md { flex: 1; overflow-y: auto; padding: 16px 20px; }
.drawer .state { font-size: 12px; color: var(--muted); }
.close { border: 0 !important; background: none !important; color: var(--muted); font-size: 22px; line-height: 1; padding: 0 4px !important; }
.drop { position: fixed; inset: 0; background: rgba(59,91,219,.12); border: 3px dashed var(--accent); display: none;
        align-items: center; justify-content: center; font-size: 20px; color: var(--accent); z-index: 20; pointer-events: none; }
.drop.show { display: flex; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
         padding: 8px 16px; border-radius: 10px; font-size: 13px; z-index: 30; display: none; }
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><b>RH</b> 论文研究台</div>
  <div class="sec">研究主题</div>
  <form class="topic-form" id="topicForm"><textarea id="topicInput" rows="2" placeholder="给一个主题，自动找论文、读完写综述。例如：长上下文 LLM 的位置编码（Enter 开始）"></textarea></form>
  <div class="topics" id="topics"></div>
  <div class="sec">论文</div>
  <form class="add" id="addForm"><input id="addInput" placeholder="arXiv 编号或链接"><button>导入</button></form>
  <label class="upload">＋ 上传 PDF（或拖进窗口）<input type="file" id="file" accept="application/pdf" multiple hidden></label>
  <div class="papers" id="papers"></div>
  <div class="side-hint">用本机登录的 Claude Code 回答，无需设置</div>
</aside>
<section id="pdfPane">
  <div class="pdfbar" id="pdfBar" hidden><span id="pdfTitle"></span><button id="studyBtn">精读这篇 →</button>
    <button class="maxbtn" id="maxPdf" title="论文最大化（⌘1，Esc 还原）">⤢</button></div>
  <div class="pdf-empty" id="pdfEmpty">左边导入一篇论文，或者给一个研究主题</div>
  <iframe id="pdf" hidden></iframe>
</section>
<div id="divider"></div>
<main>
  <div class="topbar">
    <button id="toggleSide" title="收起/展开侧栏">☰</button>
    <span class="title" id="ctxTitle">论文研究台</span>
    <select id="chatSel" title="对话"></select>
    <button id="newChat">＋ 新对话</button>
    <button id="notesBtn">📝 笔记</button>
    <button id="togglePdf" title="隐藏/显示论文">📄</button>
    <button class="maxbtn" id="maxChat" title="对话最大化（⌘2，Esc 还原）">⤢</button>
  </div>
  <div class="strip" id="strip" hidden></div>
  <div id="scroll"><div class="thread" id="thread"></div></div>
  <div class="composer">
    <div class="quick" id="quick"></div>
    <div class="box">
      <textarea id="input" rows="1" placeholder="问点什么……（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send" id="send" disabled>发送</button>
    </div>
  </div>
</main>
<div class="drawer" id="drawer">
  <header><h3 id="drawerTitle">📝 笔记</h3><span class="state" id="noteState"></span>
    <a class="exp" id="expMd" title="下载 Markdown 文件">⬇ Markdown</a>
    <a class="exp" id="expPdf" target="_blank" title="打开打印版，选「存储为 PDF」">🖨 PDF</a>
    <button id="noteMode">编辑</button><button class="close" id="drawerClose">×</button></header>
  <div class="md" id="notePreview"></div>
  <textarea id="noteEdit" hidden></textarea>
</div>
<div class="drop" id="drop">松手导入 PDF</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;
const QUICK = [
  ['三分钟速览', '用三分钟能读完的篇幅告诉我：这篇论文要解决什么问题、核心想法是什么、关键结果如何、我应该重点读哪几节。'],
  ['带我精读', '带我逐节精读这篇论文。先给出论文结构和建议的阅读路线，然后从第一个关键部分开始，每次只讲一部分，讲完问我是否继续。'],
  ['拆解核心方法', '把论文的核心方法和关键公式拆开讲：每个符号的含义、每一步为什么这样做、和最朴素的做法相比好在哪里。'],
  ['考考我', '根据我们到目前为止讨论的内容（还没讨论过就按论文核心内容）出 3 道检验理解的题，由浅到深。一次只出一题，等我回答后批改，再出下一题。'],
  ['设计小实验', '设计一个能在我电脑上几分钟内跑完的小实验，直观验证这篇论文的一个核心主张。说明实验设计和预期结果，写好代码让我运行。'],
  ['批判性评价', '批判性地评价这篇论文：假设是否合理、实验是否充分、有哪些局限或可能的漏洞、哪些后续工作值得接着读。'],
  ['整理笔记', '把我们这次对话的要点整理成一份简洁的学习笔记（核心概念、关键公式的直觉、我容易搞错的地方、待解决的问题），追加到 notes.md。'],
];
const TOPIC_QUICK = [
  ['推荐阅读顺序', '我是这个方向的新手，给我一个具体的阅读顺序：每篇读什么部分、读之前需要懂什么。'],
  ['方法对比', '用一张表对比这几篇的核心方法：思路、优点、缺点、适用场景，以及它们之间的继承关系。'],
  ['最新进展', '再找找最近一年这个方向的新论文（用 --new 搜），挑重要的补充进来，更新报告。'],
  ['开放问题', '这个方向还有哪些没解决的问题？哪些适合作为研究切入点？说说理由。'],
  ['补充论文', '你觉得报告里还漏了哪些重要论文？找出来补上。'],
];
const STYLES = [['tutor', '导师（一步步问我）'], ['explain', '直接讲解'], ['skim', '速读'], ['lab', '动手实验']];

let papers = [], topics = [];
let ctx = null;          // {kind: 'papers'|'topics', id, title, ...}
let current = null, lastJson = '', pollTimer = null, running = false, pollCount = 0;
let pdfId = null;        // 中间正在显示的论文
let style = localStorage.getItem('rh.style') || 'tutor';
const base = () => `/api/${ctx.kind}/${enc(ctx.id)}`;
const isTopic = () => ctx && ctx.kind === 'topics';

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {'Content-Type': 'application/json'}, ...opts});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}
function toast(msg, ms = 3000) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms); }

/* ---------- Markdown + 公式 + 页码 / 论文链接 ---------- */
function renderMd(text) {
  const code = [], math = [];
  let s = String(text || '').replace(/```[\s\S]*?(```|$)|`[^`\n]+`/g, m => `\u0000C${code.push(m) - 1}\u0000`);
  const put = (tex, display) => `\u0000M${math.push({tex, display}) - 1}\u0000`;
  s = s.replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => put(t, true))
       .replace(/\\\[([\s\S]+?)\\\]/g, (_, t) => put(t, true))
       .replace(/\\\(([\s\S]+?)\\\)/g, (_, t) => put(t, false))
       .replace(/(^|[^\\\w$])\$(?!\s)([^$\n]+?)(?<!\s)\$(?![\w$])/g, (_, pre, t) => pre + put(t, false));
  s = s.replace(/\u0000C(\d+)\u0000/g, (_, i) => code[i]);
  s = s.replace(/\[\[RUN\s+(experiments\/[\w./-]+\.py)\s*\]\]/g, (_, f) => `<p class="runline" data-file="${esc(f)}"></p>`);
  s = s.replace(/\[\[CONFIRM\]\]/g, '<p class="confirmline"></p>');
  let html = marked.parse(s, {gfm: true});
  html = html.replace(/\u0000M(\d+)\u0000/g, (_, i) => {
    const m = math[i];
    try { return katex.renderToString(m.tex, {displayMode: m.display, throwOnError: false}); } catch { return esc(m.tex); }
  });
  return html;
}
function linkPages(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest('code,pre,a,.katex') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  const re = /(?:\bpp?\.\s?|第\s?)(\d{1,3})(?:\s?[-–~]\s?(\d{1,3}))?(\s?页)?/g;
  for (const n of nodes) {
    const t = n.textContent; re.lastIndex = 0;
    if (!re.test(t)) continue;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment(); let last = 0, m;
    while ((m = re.exec(t))) {
      if (m[0].startsWith('第') && !m[3]) continue;
      frag.append(t.slice(last, m.index));
      const a = document.createElement('a'); a.className = 'pg'; a.href = '#'; a.dataset.page = m[1]; a.textContent = m[0];
      frag.append(a); last = m.index + m[0].length;
    }
    frag.append(t.slice(last)); n.replaceWith(frag);
  }
}
function fixLinks(root) {
  root.querySelectorAll('img').forEach(img => {
    const src = img.getAttribute('src') || '';
    if (ctx && ctx.kind === 'papers' && !/^(https?:|data:|\/)/.test(src))
      img.src = `/files/${enc(ctx.id)}/${src.replace(/^\.\//, '')}`;
  });
  root.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (h.startsWith('paper:')) { a.classList.add('paperlink'); a.dataset.paper = h.slice(6).split('#')[0]; a.href = '#'; }
    else if (/^https?:/.test(h)) { a.target = '_blank'; a.rel = 'noopener'; }
  });
}
function decorate(root) { if (!isTopic()) linkPages(root); fixLinks(root); }
document.addEventListener('click', e => {
  const pg = e.target.closest('a.pg');
  if (pg) { e.preventDefault(); showPdf(pdfId, +pg.dataset.page); return; }
  const pl = e.target.closest('[data-paper]');
  if (pl) { e.preventDefault(); showPdf(pl.dataset.paper, 1); }
});

/* ---------- 侧栏 ---------- */
async function loadSide() {
  [papers, topics] = await Promise.all([api('/api/papers'), api('/api/topics')]);
  renderSide();
}
let showArch = {topics: false, papers: false};
function renderSide() {
  const on = (k, id) => ctx && ctx.kind === k && ctx.id === id ? 'active' : '';
  const acts = x => `<span class="acts"><button data-act="rename" title="重命名">✎</button>
    <button data-act="archive" title="${x.archived ? '取消归档' : '归档'}">${x.archived ? '↩' : '🗄'}</button>
    <button data-act="delete" title="删除">×</button></span>`;
  const topicItem = t => `
    <div class="paper topic ${on('topics', t.id)} ${t.archived ? 'archived' : ''}" data-kind="topics" data-id="${esc(t.id)}">
      <div>🔭 ${esc(t.title)}</div><div class="s">${t.papers.length} 篇论文${t.created ? ' · ' + esc(t.created) : ''}</div>${acts(t)}</div>`;
  const paperItem = p => `
    <div class="paper ${on('papers', p.id)} ${p.archived ? 'archived' : ''}" data-kind="papers" data-id="${esc(p.id)}">
      <div>${esc(p.title)}</div>${p.subtitle ? `<div class="s">${esc(p.subtitle)}</div>` : ''}${acts(p)}</div>`;
  const section = (list, kind, item) => {
    const live = list.filter(x => !x.archived), arch = list.filter(x => x.archived);
    return live.map(item).join('') + (arch.length ? `<div class="arch-toggle" data-arch="${kind}">
      ${showArch[kind] ? '▾' : '▸'} 已归档（${arch.length}）</div>` + (showArch[kind] ? arch.map(item).join('') : '') : '');
  };
  $('#topics').innerHTML = section(topics, 'topics', topicItem);
  $('#papers').innerHTML = section(papers, 'papers', paperItem);
}
async function renameCtx(kind, id) {
  const obj = (kind === 'topics' ? topics : papers).find(x => x.id === id); if (!obj) return;
  const title = prompt('重命名', obj.title);
  if (!title || !title.trim() || title.trim() === obj.title) return;
  await api(`/api/${kind}/${enc(id)}`, {method: 'PUT', body: JSON.stringify({title: title.trim()})});
  await loadSide();
  if (ctx && ctx.kind === kind && ctx.id === id) { ctx.title = title.trim(); $('#ctxTitle').textContent = (kind === 'topics' ? '🔭 ' : '') + ctx.title; }
}
$('#side').onclick = async e => {
  const tog = e.target.closest('[data-arch]');
  if (tog) { showArch[tog.dataset.arch] = !showArch[tog.dataset.arch]; return renderSide(); }
  const item = e.target.closest('.paper'); if (!item) return;
  const {kind, id} = item.dataset;
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'rename') { e.stopPropagation(); return renameCtx(kind, id); }
  if (act === 'archive') {
    e.stopPropagation();
    const obj = (kind === 'topics' ? topics : papers).find(x => x.id === id);
    await api(`/api/${kind}/${enc(id)}`, {method: 'PUT', body: JSON.stringify({archived: !obj.archived})});
    toast(obj.archived ? '已取消归档' : '已归档，在列表底部「已归档」里能找到');
    return loadSide();
  }
  if (act === 'delete') {
    e.stopPropagation();
    const name = (kind === 'topics' ? topics : papers).find(x => x.id === id)?.title;
    const what = kind === 'topics' ? '这个主题的对话和报告（下载的论文会保留在论文库）' : '它的对话、笔记和实验';
    if (!confirm(`删除「${name}」？${what}都会一起删除。`)) return;
    await api(`/api/${kind}/${enc(id)}`, {method: 'DELETE'});
    if (ctx && ctx.id === id) { ctx = null; current = null; }
    if (pdfId === id) { pdfId = null; showPdf(null); }
    await loadSide();
    return ctx ? null : openDefault();
  }
  openCtx(kind, id);
};
$('#topicInput').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#topicForm').requestSubmit(); } };
$('#topicForm').onsubmit = async e => {
  e.preventDefault();
  const title = $('#topicInput').value.trim(); if (!title) return;
  try {
    const t = await api('/api/topics', {method: 'POST', body: JSON.stringify({title})});
    $('#topicInput').value = '';
    await loadSide();
    await openCtx('topics', t.id, t.chat_id);
  } catch (err) { toast(err.message, 5000); }
};
$('#addForm').onsubmit = async e => {
  e.preventDefault();
  const text = $('#addInput').value.trim(); if (!text) return;
  const btn = e.target.querySelector('button'); btn.disabled = true; btn.textContent = '下载中…';
  try { const p = await api('/api/papers/import', {method: 'POST', body: JSON.stringify({text})});
        $('#addInput').value = ''; await loadSide(); openCtx('papers', p.id); }
  catch (err) { toast(err.message, 5000); }
  finally { btn.disabled = false; btn.textContent = '导入'; }
};
async function uploadFiles(files) {
  let last;
  for (const f of files) {
    if (!/\.pdf$/i.test(f.name)) continue;
    toast(`正在导入 ${f.name}…`);
    try {
      const r = await fetch('/api/papers/upload?name=' + enc(f.name), {method: 'POST', body: f});
      if (!r.ok) throw new Error((await r.json()).detail);
      last = await r.json();
    } catch (err) { toast(`${f.name}：${err.message}`, 5000); }
  }
  if (last) { await loadSide(); openCtx('papers', last.id); }
}
$('#file').onchange = e => { uploadFiles([...e.target.files]); e.target.value = ''; };
let dragDepth = 0;
addEventListener('dragenter', e => { if (e.dataTransfer.types.includes('Files')) { dragDepth++; $('#drop').classList.add('show'); } });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').classList.remove('show'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('#drop').classList.remove('show'); uploadFiles([...e.dataTransfer.files]); });

/* ---------- 中间 PDF ---------- */
let pdfNonce = 0;
function paperById(id) { return papers.find(p => p.id === id) || (isTopic() ? ctx.papers.find(p => p.id === id) : null); }
function showPdf(id, page) {
  pdfId = id || null;
  const has = !!pdfId;
  $('#pdfEmpty').hidden = has; $('#pdf').hidden = !has;
  $('#pdfEmpty').textContent = isTopic() ? '正在调研，下载的论文会出现在上面的论文条里，点一下在这里打开' : '左边导入一篇论文，或者给一个研究主题';
  $('#pdfBar').hidden = !has;
  $('#studyBtn').hidden = !isTopic();
  if (has) {
    $('#pdf').src = `/files/${enc(pdfId)}/paper.pdf?v=${pdfNonce++}#page=${page || 1}&view=FitH`;
    $('#pdfTitle').textContent = paperById(pdfId)?.title || pdfId;
    $('#pdfPane').classList.remove('hidden');
  } else { $('#pdf').removeAttribute('src'); }
  document.querySelectorAll('#strip [data-paper]').forEach(b => b.classList.toggle('on', b.dataset.paper === pdfId));
}
$('#studyBtn').onclick = () => { if (pdfId) openCtx('papers', pdfId); };

/* ---------- 打开论文 / 主题 ---------- */
async function openDefault() {
  const last = JSON.parse(localStorage.getItem('rh.ctx') || 'null');
  if (last && (last.kind === 'topics' ? topics : papers).some(x => x.id === last.id)) return openCtx(last.kind, last.id);
  const t = topics.find(x => !x.archived), p = papers.find(x => !x.archived);
  if (t) return openCtx('topics', t.id);
  if (p) return openCtx('papers', p.id);
  ctx = null; showPdf(null); showHello();
}
async function openCtx(kind, id, chatId) {
  const obj = (kind === 'topics' ? topics : papers).find(x => x.id === id);
  if (!obj) return;
  const changed = !ctx || ctx.kind !== kind || ctx.id !== id;
  ctx = {kind, ...obj};
  localStorage.setItem('rh.ctx', JSON.stringify({kind, id}));
  renderSide();
  $('#ctxTitle').textContent = (kind === 'topics' ? '🔭 ' : '') + obj.title;
  document.title = obj.title + ' · 论文研究台';
  $('#notesBtn').textContent = kind === 'topics' ? '📋 报告' : '📝 笔记';
  $('#drawerTitle').textContent = kind === 'topics' ? '📋 综述报告' : '📝 笔记';
  if (changed) {
    current = null; closeNotes();
    renderStrip();
    showPdf(kind === 'papers' ? id : (ctx.papers[0]?.id || null), 1);
  }
  const chats = await loadChats();
  if (chatId) return openChat(chatId);
  if (changed) chats.length ? openChat(chats[0].id) : newChat();
}
function renderStrip() {
  const show = isTopic() && ctx.papers.length;
  $('#strip').hidden = !show;
  if (!show) return;
  $('#strip').innerHTML = ctx.papers.map(p =>
    `<button data-paper="${esc(p.id)}" class="${p.id === pdfId ? 'on' : ''}" title="${esc(p.title)}">📄 ${esc(p.title)}</button>`).join('');
}
async function refreshTopic() {
  if (!isTopic()) return;
  const t = await api(`/api/topics/${enc(ctx.id)}`).catch(() => null);
  if (!t || !isTopic() || ctx.id !== t.id) return;
  const grew = t.papers.length !== ctx.papers.length;
  ctx.papers = t.papers;
  if (grew) {
    renderStrip();
    if (!pdfId && t.papers[0]) showPdf(t.papers[0].id, 1);
    papers = await api('/api/papers'); topics = await api('/api/topics'); renderSide();
  }
}

/* ---------- 对话 ---------- */
async function loadChats() {
  if (!ctx) return [];
  const list = await api(`${base()}/chats`);
  $('#chatSel').innerHTML = `<option value="">＋ 新对话</option>` +
    list.map(c => `<option value="${esc(c.id)}">${c.running ? '⏳ ' : ''}${esc(c.title)}</option>`).join('');
  $('#chatSel').value = current || '';
  return list;
}
$('#chatSel').onchange = e => e.target.value ? openChat(e.target.value) : newChat();
$('#newChat').onclick = () => newChat();

function showHello() {
  $('#thread').innerHTML = `<div class="hello"><h1>开始研究</h1>
    <div class="sub">左上角给一个<b>研究主题</b>：我会自己去找论文、下载、读完，写一份综述，再陪你追问。<br>
    或者在下面导入<b>一篇论文</b>（arXiv 编号如 1706.03762，或把 PDF 拖进窗口），一问一答地精读、做实验。<br>
    回答用你电脑上已登录的 Claude Code，不用任何设置。</div></div>`;
  $('#quick').innerHTML = ''; $('#strip').hidden = true; updateComposer();
}
function newChat() {
  if (!ctx) return showHello();
  current = null; lastJson = ''; running = false; clearTimeout(pollTimer);
  $('#chatSel').value = '';
  if (isTopic()) {
    $('#thread').innerHTML = `<div class="hello"><h1>🔭 ${esc(ctx.title)}</h1>
      <div class="sub">已下载 ${ctx.papers.length} 篇论文。可以继续问这个方向的任何问题，报告在右上角「📋 报告」。</div>
      <div class="chips">${TOPIC_QUICK.map(([l, p]) => `<button data-q="${esc(p)}">${esc(l)}</button>`).join('')}</div></div>`;
  } else {
    $('#thread').innerHTML = `<div class="hello"><h1>${esc(ctx.title)}</h1>
      ${ctx.subtitle ? `<div class="sub">${esc(ctx.subtitle)}</div>` : ''}
      ${ctx.abstract ? `<div class="abs">${esc(ctx.abstract)}</div>` : ''}
      <div class="chips">${QUICK.slice(0, 6).map(([l, p]) => `<button data-q="${esc(p)}">${esc(l)}</button>`).join('')}</div>
      <div class="styles">这个对话的风格：${STYLES.map(([k, l]) => `<span data-style="${k}" class="${k === style ? 'on' : ''}">${l}</span>`).join('')}</div>
      <div class="sub">回答里的页码可以点，左边论文会跳过去。让它做实验时，它写好代码后会出现「运行」按钮。</div></div>`;
    document.querySelectorAll('[data-style]').forEach(el => el.onclick = () => {
      style = el.dataset.style; localStorage.setItem('rh.style', style);
      document.querySelectorAll('[data-style]').forEach(x => x.classList.toggle('on', x === el));
    });
  }
  document.querySelectorAll('.hello [data-q]').forEach(b => b.onclick = () => send(b.dataset.q));
  $('#quick').innerHTML = '';
  updateComposer(); $('#input').focus();
}

async function openChat(id) {
  if (!ctx) return;
  const switching = id !== current;
  if (switching) lastJson = '';
  current = id; clearTimeout(pollTimer);
  const key = ctx.kind + ctx.id;
  let chat;
  try { chat = await api(`${base()}/chats/${id}`); } catch { return newChat(); }
  if (current !== id || !ctx || ctx.kind + ctx.id !== key) return;
  const wasRunning = running;
  running = chat.running;
  const json = JSON.stringify(chat.messages) + running;
  if (json !== lastJson) { lastJson = json; renderThread(chat, switching); }
  const q = isTopic() ? TOPIC_QUICK : QUICK;
  $('#quick').innerHTML = q.map(([l, p]) => `<button data-q="${esc(p)}" title="${esc(p)}">${esc(l)}</button>`).join('');
  document.querySelectorAll('#quick [data-q]').forEach(b => b.onclick = () => send(b.dataset.q));
  updateComposer();
  if (switching || wasRunning !== running) loadChats();
  if (isTopic() && (running || wasRunning) && (pollCount++ % 3 === 0 || !running)) refreshTopic();
  if (running) pollTimer = setTimeout(() => openChat(id), 900);
  else if (wasRunning && $('#drawer').classList.contains('show')) loadNotes();
}

const ICON = {read: '📖', view: '🖼', write: '✏️', note: '📝', search: '🔎', fetch: '🌐', import: '📥', run: '▶'};
function renderStep(p) {
  const icon = p.status === 'running' ? '<span class="spin"></span>' : p.status === 'error' ? '✗' : (ICON[p.kind] || '⚙︎');
  const link = p.paper_id && p.status !== 'error';
  const head = `<div class="step ${p.status === 'error' ? 'err' : ''} ${link ? 'link' : ''}" ${link ? `data-paper="${esc(p.paper_id)}"` : ''}>
    ${icon} ${esc(p.label)} ${p.detail ? `<span class="d">${esc(p.detail)}</span>` : ''}</div>`;
  if (p.kind === 'write' && p.code) return head + `<details class="code"><summary>查看代码</summary><pre>${esc(p.code)}</pre></details>`;
  if (p.output && p.status === 'error') return head + `<details class="code"><summary>错误信息</summary><pre>${esc(p.output)}</pre></details>`;
  return head;
}
function renderRun(m) {
  const icon = m.status === 'running' ? '<span class="spin"></span>' : m.status === 'done' ? '✅' : m.status === 'stopped' ? '⏹' : '⚠️';
  const txt = m.status === 'running' ? '运行中…' : m.status === 'stopped' ? '已停止' : `退出码 ${m.exit_code ?? '?'} · ${m.elapsed ?? ''} 秒`;
  const imgs = (m.images || []).map(src => `<img src="/files/${enc(ctx.id)}/${esc(src)}">`).join('');
  return `<div class="run ${m.status === 'error' ? 'err' : ''}"><div class="h">${icon} 运行 <b>${esc(m.file)}</b>
    <span style="margin-left:auto;color:var(--muted)">${txt}</span></div>
    ${m.output ? `<pre>${esc(m.output)}</pre>` : ''}${imgs}</div>`;
}
function renderThread(chat, jump) {
  const sc = $('#scroll');
  const nearBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 140;
  $('#thread').innerHTML = chat.messages.map(m => {
    if (m.role === 'user') return m.auto ? '' : `<div class="msg user"><div class="bubble">${esc(m.text)}</div></div>`;
    if (m.role === 'run') return renderRun(m);
    const parts = (m.parts || []).map(p => p.type === 'text' ? `<div class="md">${renderMd(p.text)}</div>` : renderStep(p)).join('');
    const draft = m.draft ? `<div class="md caret">${renderMd(m.draft)}</div>` : '';
    const busy = m.status === 'running' && !draft && !(m.parts || []).some(p => p.status === 'running')
      ? `<div class="thinking"><span class="spin"></span>${(m.parts || []).length ? '思考中…' : (isTopic() ? '正在规划调研…' : '正在读论文、思考…')}</div>` : '';
    const err = m.status === 'error' ? `<div class="error">出错了：${esc(m.error || '')}</div>`
      : m.status === 'stopped' ? '<div class="meta-line">已停止</div>' : '';
    const meta = m.status === 'done' && m.elapsed ? `<div class="meta-line">用时 ${m.elapsed < 60 ? m.elapsed + ' 秒' : Math.round(m.elapsed / 60) + ' 分钟'}</div>` : '';
    return `<div class="msg"><div class="avatar">C</div><div class="body">${parts}${draft}${busy}${err}${meta}</div></div>`;
  }).join('');
  const root = $('#thread');
  root.querySelectorAll('.md').forEach(decorate);
  const confirms = root.querySelectorAll('.confirmline');
  confirms.forEach((el, i) => {
    const last = i === confirms.length - 1 && chat.messages[chat.messages.length - 1].role === 'assistant';
    if (!last) { el.innerHTML = '<span class="meta-line">（计划已确认）</span>'; return; }
    el.innerHTML = `<button class="runbtn" ${running ? 'disabled' : ''}>✅ 按这个计划开始</button>
      <span class="meta-line" style="margin-left:8px">想调整就直接在下面说，比如「去掉第 3 篇，加上 FlashAttention」</span>`;
    el.querySelector('button').onclick = () => send('确认，就按这个计划开始下载和阅读。');
  });
  root.querySelectorAll('.runline').forEach(el => {
    const f = el.dataset.file;
    el.innerHTML = `<button class="runbtn" ${running ? 'disabled' : ''}>▶ 运行 <small>${esc(f)}</small></button>`;
    el.querySelector('button').onclick = () => runFile(f);
  });
  if (jump || nearBottom) sc.scrollTop = sc.scrollHeight;
}

async function runFile(file) {
  if (running || !current || isTopic()) return;
  try {
    await api(`${base()}/chats/${current}/run`, {method: 'POST', body: JSON.stringify({file})});
    lastJson = ''; await openChat(current);
    $('#scroll').scrollTop = $('#scroll').scrollHeight;
  } catch (e) { toast(e.message, 5000); }
}

function updateComposer() {
  const btn = $('#send');
  btn.textContent = running ? '停止' : '发送';
  btn.classList.toggle('stop', running);
  btn.disabled = !ctx || (!running && !$('#input').value.trim());
  $('#input').disabled = !ctx;
  $('#newChat').disabled = !ctx; $('#notesBtn').disabled = !ctx;
}
async function send(text) {
  text = (text ?? $('#input').value).trim();
  if (!text || running || !ctx) return;
  $('#input').value = ''; autosize();
  try {
    const {id} = await api(`${base()}/chats`, {method: 'POST', body: JSON.stringify({message: text, chat_id: current, style})});
    current = null;
    await openChat(id);
  } catch (e) { toast(e.message, 5000); $('#input').value = text; updateComposer(); }
}
$('#send').onclick = async () => {
  if (running) { await api(`${base()}/chats/${current}/stop`, {method: 'POST'}); return; }
  send();
};
function autosize() { const t = $('#input'); t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; updateComposer(); }
$('#input').oninput = autosize;
$('#input').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } };

/* ---------- 笔记 / 报告 ---------- */
let noteTimer = null, noteEditing = false;
async function loadNotes() {
  if (!ctx) return;
  const {text} = await api(`${base()}/notes`);
  if (!noteEditing) $('#noteEdit').value = text;
  renderNotePreview();
}
function renderNotePreview() {
  const text = $('#noteEdit').value;
  $('#notePreview').innerHTML = text.trim() ? renderMd(text)
    : `<p style="color:var(--muted)">${isTopic() ? '调研完成后，综述报告会出现在这里。' : '还没有笔记。点「编辑」自己写，或者在对话里点「整理笔记」。'}</p>`;
  decorate($('#notePreview'));
}
$('#notesBtn').onclick = () => {
  if (!ctx) return;
  $('#expMd').href = `${base()}/export.md`;
  $('#expPdf').href = `/print/${ctx.kind}/${enc(ctx.id)}`;
  $('#drawer').classList.add('show'); loadNotes();
};
function closeNotes() { $('#drawer').classList.remove('show'); setNoteMode(false); }
$('#drawerClose').onclick = closeNotes;
function setNoteMode(edit) {
  noteEditing = edit;
  $('#noteEdit').hidden = !edit; $('#notePreview').hidden = edit;
  $('#noteMode').textContent = edit ? '预览' : '编辑';
  if (edit) $('#noteEdit').focus(); else renderNotePreview();
}
$('#noteMode').onclick = () => setNoteMode(!noteEditing);
$('#noteEdit').oninput = () => {
  $('#noteState').textContent = '未保存…'; clearTimeout(noteTimer);
  const url = `${base()}/notes`;
  noteTimer = setTimeout(async () => {
    await api(url, {method: 'PUT', body: JSON.stringify({text: $('#noteEdit').value})});
    $('#noteState').textContent = '已保存';
  }, 700);
};
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#drawer').classList.contains('show')) closeNotes(); else setMax(null);
  } else if ((e.metaKey || e.ctrlKey) && (e.key === '1' || e.key === '2')) {
    e.preventDefault(); setMax(e.key === '1' ? 'pdf' : 'chat', true);
  }
});

/* ---------- 布局 ---------- */
$('#ctxTitle').ondblclick = () => { if (ctx) renameCtx(ctx.kind, ctx.id); };
$('#ctxTitle').title = '双击重命名';
function setMax(which, toggle) {
  const cur = document.body.classList.contains('max-pdf') ? 'pdf' : document.body.classList.contains('max-chat') ? 'chat' : null;
  const next = toggle && cur === which ? null : which;
  document.body.classList.toggle('max-pdf', next === 'pdf');
  document.body.classList.toggle('max-chat', next === 'chat');
  $('#maxPdf').textContent = next === 'pdf' ? '⤡' : '⤢';
  $('#maxChat').textContent = next === 'chat' ? '⤡' : '⤢';
  $('#maxPdf').title = next === 'pdf' ? '还原（Esc）' : '论文最大化（⌘1，Esc 还原）';
  $('#maxChat').title = next === 'chat' ? '还原（Esc）' : '对话最大化（⌘2，Esc 还原）';
  if (next === 'pdf' && !pdfId) { setMax(null); toast('还没有打开论文'); }
}
$('#maxPdf').onclick = () => setMax('pdf', true);
$('#maxChat').onclick = () => setMax('chat', true);
// 小屏幕：打开时自动收起左侧栏（☰ 可以再展开）
if (innerWidth < 1280) $('#side').classList.add('collapsed');
$('#toggleSide').onclick = () => $('#side').classList.toggle('collapsed');
$('#togglePdf').onclick = () => $('#pdfPane').classList.toggle('hidden');
(() => {
  const div = $('#divider'), pane = $('#pdfPane');
  const saved = localStorage.getItem('rh.pdfw'); if (saved) pane.style.flex = `0 0 ${saved}px`;
  div.onmousedown = e => {
    e.preventDefault(); div.classList.add('drag'); $('#pdf').style.pointerEvents = 'none';
    const startX = e.clientX, startW = pane.getBoundingClientRect().width;
    const move = ev => { const w = Math.max(260, Math.min(innerWidth - 600, startW + ev.clientX - startX)); pane.style.flex = `0 0 ${w}px`; };
    const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); div.classList.remove('drag');
      $('#pdf').style.pointerEvents = ''; localStorage.setItem('rh.pdfw', Math.round(pane.getBoundingClientRect().width)); };
    addEventListener('mousemove', move); addEventListener('mouseup', up);
  };
})();

loadSide().then(openDefault);
</script>
</body>
</html>
